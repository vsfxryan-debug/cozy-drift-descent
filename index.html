<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1410" />
  <title>Cozy Drift Descent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="menu" class="screen active">
    <h1>Cozy Drift Descent</h1>
    <p class="subtitle">Drift. Surf. Flow.</p>
    <div class="buttons">
      <button id="btn-play">Play</button>
      <button id="btn-reset" class="ghost">Reset Save</button>
    </div>
    <p class="hint">WASD / Arrows · Space to drift · R to restart</p>
  </div>

  <div id="levels" class="screen">
    <h2>Choose a Mountain</h2>
    <div id="level-list"></div>
    <button id="btn-back" class="ghost small">Back</button>
  </div>

  <div id="hud" class="screen">
    <div class="hud-topleft">
      <div id="hud-speed">0<span>km/h</span></div>
    </div>
    <div class="hud-topright">
      <div id="hud-flow">×1.0</div>
      <div id="hud-points">0 pts</div>
    </div>
    <div class="hud-bottom">
      <div id="hud-progress-bar"><div id="hud-progress-fill"></div></div>
      <p class="hint">R to restart</p>
    </div>

    <div id="touch-controls">
      <button id="touch-brake" class="touch-btn touch-brake" aria-label="Brake">BRK</button>
      <button id="touch-left" class="touch-btn touch-left" aria-label="Steer left">◀</button>
      <button id="touch-drift" class="touch-btn touch-drift" aria-label="Drift">DRIFT</button>
      <button id="touch-right" class="touch-btn touch-right" aria-label="Steer right">▶</button>
      <button id="touch-restart" class="touch-restart" aria-label="Restart">↻</button>
      <button id="touch-flip" class="touch-flip" aria-label="Flip brake side">⇄</button>
    </div>
  </div>

  <div id="results" class="screen">
    <h2>Run Complete!</h2>
    <div id="results-stats" class="stats-grid"></div>
    <h3>Choose an Upgrade</h3>
    <div id="upgrade-cards"></div>
    <div id="leaderboard"></div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/rapier.es.js"
    }
  }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
